services:
  app:
    build: .
    container_name: honbab-diary-app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/honbab_diary
      SPRING_DATASOURCE_USERNAME: honbab
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-honbab1234}
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-c2VjcmV0S2V5Rm9ySG9uYmFiRGlhcnlBcHBsaWNhdGlvbkRldmVsb3BtZW50T25seTIwMjY=}
    networks:
      - honbab-network

  postgres:
    image: postgres:16-alpine
    container_name: honbab-diary-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: honbab_diary
      POSTGRES_USER: honbab
      POSTGRES_PASSWORD: ${DB_PASSWORD:-honbab1234}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honbab -d honbab_diary"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - honbab-network

  redis:
    image: redis:7-alpine
    container_name: honbab-diary-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - honbab-network

volumes:
  postgres_data:
  redis_data:

networks:
  honbab-network:
    driver: bridge
